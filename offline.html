<!doctype html>
<html lang="pt-BR">

<head>

    <meta name="theme-color" content="#C64340">
    <title>Sem conexão · Caminho</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #F9F4F1;
            color: #1a1a1a;
            font: 400 15px/1.5 "Source Sans 3", system-ui, sans-serif;
            text-align: center;

            border-radius: 999px;
            padding: 14px 28px;

        }

<body>
    <main>
        <img src="/Assets/logo-mark.png" alt="">

</html>
